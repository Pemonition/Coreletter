# Demonstração local completa: `docker compose up --build` sobe o banco e a aplicação (API + Angular na mesma imagem).
# Abra http://localhost:8080. Para desenvolver com recarga automática, use os scripts (README): Start-Database, Start-Api, Start-Web.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radarplural
      POSTGRES_USER: radarplural
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radarplural -d radarplural"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    # Mesma imagem do Render (Dockerfile da raiz): o que roda aqui é o que roda na nuvem.
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o banco é "postgres", na porta interna 5432.
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=radarplural;Username=radarplural;Password=${POSTGRES_PASSWORD}
      # E-mail de uma conta já cadastrada que vira administradora ao iniciar (opcional, no .env).
      BootstrapAdminEmail: ${BootstrapAdminEmail:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # A imagem aspnet não traz curl; o bash abre a conexão e confere o 200 do readiness (que consulta o banco).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  postgres_data:
