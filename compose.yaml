services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radarplural
      POSTGRES_USER: radarplural
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radarplural -d radarplural"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
