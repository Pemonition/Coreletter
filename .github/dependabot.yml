# Atualizações de dependência em PRs semanais (revisar como qualquer outra PR; nada é aplicado sozinho).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dotnet: { patterns: ["Microsoft.*", "Npgsql*", "System.*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      angular: { patterns: ["@angular/*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
