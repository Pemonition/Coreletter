name: Validar projeto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coreletter_ci
          POSTGRES_USER: coreletter_ci
          POSTGRES_PASSWORD: disposable-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coreletter_ci -d coreletter_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Testes (unitários + integração com PostgreSQL)
        env:
          # Servidor descartável: os testes de integração criam e apagam bancos temporários (PgStoryQueueTests).
          INTEGRATION_DATABASE_URL: Host=localhost;Port=5432;Database=coreletter_ci;Username=coreletter_ci;Password=disposable-ci-only-password
        run: dotnet test backend/RadarPlural.slnx --configuration Release
      - name: Iniciar API com PostgreSQL descartavel
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=coreletter_ci;Username=coreletter_ci;Password=disposable-ci-only-password
        run: |
          dotnet run --no-build --no-launch-profile --configuration Release --project backend/RadarPlural.Api > /tmp/coreletter-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5080/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/coreletter-api.log
          exit 1
      - name: Testar API e isolamento entre contas
        shell: pwsh
        run: ./scripts/Test-Api.ps1
      - name: Diagnostico de falha da API
        if: failure()
        run: cat /tmp/coreletter-api.log || true
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  container:
    # Valida a imagem de deploy: build Angular + API, migrações num PostgreSQL vazio e front servido pela API.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coreletter_ci
          POSTGRES_USER: coreletter_ci
          POSTGRES_PASSWORD: disposable-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coreletter_ci -d coreletter_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - name: Validar manifests do Kubernetes (esquema oficial)
        run: >-
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary -kubernetes-version 1.31.0 -ignore-filename-pattern kustomization.yaml /k8s
      - run: docker build -t coreletter .
      - run: docker build -f Dockerfile.worker -t coreletter-worker .
      - name: Migração como passo único (o que o Job do Kubernetes faz)
        run: >-
          docker run --rm --network host
          -e "ConnectionStrings__Default=postgresql://coreletter_ci:disposable-ci-only-password@localhost:5432/coreletter_ci"
          coreletter --migrate-only
      - name: Worker inicia na imagem
        run: |
          set +e
          docker run --rm coreletter-worker --etapa inexistente
          code=$?
          test "$code" -eq 2 || { echo "esperado código 2 (etapa inexistente), veio $code"; exit 1; }
      - name: Iniciar container
        # Development aqui so para o cookie aceitar http no teste; em producao o cookie exige https.
        run: |
          docker run -d --name coreletter --network host             -e ASPNETCORE_ENVIRONMENT=Development -e PORT=5080             -e "ConnectionStrings__Default=postgresql://coreletter_ci:disposable-ci-only-password@localhost:5432/coreletter_ci"             coreletter
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5080/api/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:5080/ | grep -q "<app-root>"
      - name: Testar API no container
        shell: pwsh
        run: ./scripts/Test-Api.ps1
      - name: Logs do container
        if: always()
        run: docker logs coreletter || true

